<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Wedding Flower Puzzle</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Parisienne&display=swap');


/* =========================================================
   기본 설정
========================================================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;

  background: #fff8f4;
  color: #513c38;

  font-family: 'Gowun Dodum', sans-serif;
}

button {
  font: inherit;
}

.screen {
  position: fixed;
  inset: 0;
  display: none;
}

.screen.active {
  display: flex;
}


/* =========================================================
   START 화면
========================================================= */

#start {
  align-items: center;
  justify-content: center;
  flex-direction: column;

  padding: 24px;

  background:
    radial-gradient(
      circle at 30% 18%,
      rgba(255, 255, 255, .98),
      rgba(255, 255, 255, 0) 30%
    ),
    linear-gradient(
      160deg,
      #fffaf6 0%,
      #fbe9e8 57%,
      #f5d6d5 100%
    );
}

.start-emoji {
  font-size: 56px;

  animation:
    float 2.8s ease-in-out infinite;
}

.start-title {
  margin-top: 12px;

  font-family: 'Parisienne', cursive;
  font-size: 48px;

  color: #b56f75;
}

.start-sub {
  margin: 2px 0 32px;

  font-size: 14px;
  color: #98706c;
}

.start-btn {
  width: 154px;
  height: 54px;

  border: 1px solid #daa1a4;
  border-radius: 999px;

  background:
    rgba(255, 255, 255, .72);

  color: #9e6266;

  font-size: 17px;
  letter-spacing: 3px;

  box-shadow:
    0 12px 30px rgba(139, 83, 88, .16);

  cursor: pointer;
}

@keyframes float {

  0%,
  100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-8px);
  }
}


/* =========================================================
   퍼즐 화면
========================================================= */

#game {
  flex-direction: column;

  background:
    linear-gradient(
      #fffaf7,
      #fff2ec
    );
}


/* 상단 제목 */

.top {
  position: relative;

  height: 58px;

  display: flex;
  align-items: center;
  justify-content: center;
}

.top h1 {
  margin: 0;

  font-size: 16px;
  font-weight: 500;
}

.count {
  position: absolute;

  right: 16px;

  font-size: 12px;

  color: #a87975;
}


/* =========================================================
   퍼즐 판
========================================================= */

.board-wrap {
  flex: 1;
  min-height: 0;

  padding:
    0 14px 8px;

  display: flex;

  align-items: center;
  justify-content: center;
}

.board {
  position: relative;

  width:
    min(92vw, 48vh);

  aspect-ratio:
    451 / 736;

  overflow: hidden;

  background:
    #f4e8df;

  border-radius:
    18px;

  box-shadow:
    0 12px 34px rgba(114, 75, 68, .15),
    inset 0 0 0 1px rgba(178, 135, 126, .14);
}


/* 빈 퍼즐판 */

.placeholder {
  position: absolute;

  inset: 0;

  background:
    linear-gradient(
      rgba(255, 255, 255, .23),
      rgba(255, 255, 255, .23)
    ),
    radial-gradient(
      circle at 50% 35%,
      #fffaf7,
      #f7e7dc
    );
}


/* =========================================================
   4 × 4 퍼즐 칸
========================================================= */

.cell {
  position: absolute;

  width: 25%;
  height: 25%;

  border:
    .5px solid rgba(153, 112, 105, .28);
}

.cell.ok {
  border-color:
    rgba(255, 255, 255, .1);
}


/* =========================================================
   퍼즐 조각
========================================================= */

.piece {
  position: absolute;

  width: 25%;
  height: 25%;

  background-image:
    url('bouquet.png');

  background-size:
    400% 400%;

  z-index: 10;

  touch-action: none;
  user-select: none;

  box-shadow:
    0 2px 7px rgba(79, 50, 45, .22);

  transition:
    transform .12s ease,
    box-shadow .12s ease;
}

.piece.dragging {
  z-index: 50;

  transform:
    scale(1.05);

  box-shadow:
    0 10px 24px rgba(75, 46, 41, .3);

  transition: none;
}

.piece.locked {
  pointer-events: none;

  box-shadow: none;
}

.piece::after {
  content: "";

  position: absolute;

  inset: 0;

  border:
    1px solid rgba(255, 255, 255, .38);

  pointer-events: none;
}


/* =========================================================
   아래 퍼즐 조각 영역
========================================================= */

.tray-title {
  margin:
    0 0 5px;

  text-align: center;

  font-size: 12px;

  color: #9c7771;
}

.tray {
  height: 132px;

  padding:
    4px 12px 15px;

  display: grid;

  grid-template-columns:
    repeat(8, 58px);

  grid-auto-rows:
    58px;

  gap: 8px;

  overflow-x: auto;
  overflow-y: hidden;

  scrollbar-width: none;

  align-content: center;
}

.tray::-webkit-scrollbar {
  display: none;
}

.tray-slot {
  position: relative;

  width: 58px;
  height: 58px;

  overflow: hidden;

  background:
    #ffffff;

  border:
    1px solid #f0ddd6;

  border-radius:
    14px;

  box-shadow:
    0 4px 14px rgba(123, 80, 73, .1);
}

.tray-piece {
  position: absolute;

  inset: 0;

  background-image:
    url('bouquet.png');

  background-size:
    400% 400%;

  touch-action: none;
}


/* =========================================================
   퍼즐 완성 후 꽃다발
========================================================= */

#completeView {
  position: absolute;

  inset: 0;

  z-index: 20;

  display: none;
}

#completeImg {
  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;
}


/* =========================================================
   웨딩 사진 카드
   꽃 위쪽에 카드가 있고
   나무 막대가 아래 꽃 사이로 들어가는 형태
========================================================= */

.photo-frame {
  position: absolute;

  /*
     ★ 사진 위치

     left 숫자 ↑ = 오른쪽
     left 숫자 ↓ = 왼쪽

     top 숫자 ↑ = 아래
     top 숫자 ↓ = 위
  */

  left: 50%;
  top: 8%;

  transform:
    translateX(-50%)
    rotate(-1deg);

  /*
     ★ 사진 크기
     숫자를 키우면 사진이 커짐
  */

  width: 25%;

  aspect-ratio:
    4 / 3;

  z-index: 35;

  padding:
    4px 4px 13px;

  background:
    rgba(255, 255, 255, .98);

  border:
    1px solid rgba(220, 202, 194, .8);

  border-radius:
    3px;

  box-shadow:
    0 4px 12px rgba(70, 45, 40, .20);

  display: none;

  cursor: pointer;
}

.photo-frame.show {
  display: block;
}


/* =========================================================
   사진 아래 나무 막대
========================================================= */

.photo-frame::after {
  content: "";

  position: absolute;

  left: 50%;
  top: 100%;

  transform:
    translateX(-50%);

  /*
     ★ 나무 막대 두께
  */

  width: 3px;

  /*
     ★ 나무 막대 길이
     숫자를 키우면 더 아래까지 내려감
  */

  height: 125px;

  background:
    linear-gradient(
      90deg,
      #8f6a4d 0%,
      #cda77f 45%,
      #e0bd96 55%,
      #896548 100%
    );

  border-radius:
    3px;

  box-shadow:
    1px 1px 2px rgba(75, 48, 34, .18);

  /*
     카드 뒤 + 꽃 위에 보이도록
  */

  z-index: -1;
}


/* =========================================================
   업로드된 웨딩 사진
========================================================= */

.photo-preview {
  position: relative;

  width: 100%;
  height: 100%;

  object-fit: cover;

  border-radius:
    1px;

  z-index: 2;

  display: none;
}


/* =========================================================
   사진 업로드 전 카드
========================================================= */

.photo-placeholder {
  position: relative;

  width: 100%;
  height: 100%;

  border:
    1px dashed #dfb6b3;

  background:
    #fffaf8;

  color:
    #ad7b79;

  font-size:
    9px;

  display: flex;

  flex-direction: column;

  align-items: center;
  justify-content: center;

  gap: 2px;

  text-align: center;

  z-index: 2;
}

.photo-placeholder span {
  font-size:
    17px;
}

.photo-input {
  display: none;
}


/* =========================================================
   웨딩 사진 넣기 버튼
========================================================= */

.photo-upload-btn {
  position: absolute;

  left: 50%;
  bottom: 16px;

  transform:
    translateX(-50%);

  z-index: 45;

  padding:
    10px 17px;

  border:
    1px solid rgba(216, 153, 154, .65);

  border-radius:
    999px;

  background:
    rgba(255, 250, 247, .96);

  color:
    #9f6869;

  font-size:
    12px;

  white-space:
    nowrap;

  box-shadow:
    0 5px 15px rgba(100, 60, 55, .13);

  display: none;

  cursor: pointer;
}

.photo-upload-btn.show {
  display: block;
}


/* =========================================================
   꽃말 클릭 영역
========================================================= */

.hotspot {
  position: absolute;

  transform:
    translate(-50%, -50%);

  border: 0;

  background:
    transparent;

  border-radius:
    50%;

  z-index: 40;

  cursor: pointer;
}


/* =========================================================
   ★ 흰색 큰 반짝이

   이모지 ✨를 사용하지 않고
   CSS로 흰색 반짝이를 직접 만듦
========================================================= */

.hotspot::after {
  content: "";

  position: absolute;

  left:
    calc(100% - 4px);

  top:
    -17px;

  width:
    32px;

  height:
    32px;

  background:
    #ffffff;

  clip-path:
    polygon(
      50% 0%,
      57% 40%,
      100% 50%,
      57% 60%,
      50% 100%,
      43% 60%,
      0% 50%,
      43% 40%
    );

  filter:
    drop-shadow(
      0 0 3px rgba(255, 255, 255, 1)
    )
    drop-shadow(
      0 0 8px rgba(255, 255, 255, .95)
    )
    drop-shadow(
      0 0 13px rgba(255, 255, 255, .7)
    );

  animation:
    whiteSparkleBig
    1.05s
    ease-in-out
    infinite
    alternate;

  pointer-events:
    none;
}


/* 작은 보조 반짝이 */

.hotspot::before {
  content: "";

  position: absolute;

  left:
    calc(100% + 26px);

  top:
    19px;

  width:
    14px;

  height:
    14px;

  background:
    #ffffff;

  clip-path:
    polygon(
      50% 0%,
      58% 40%,
      100% 50%,
      58% 60%,
      50% 100%,
      42% 60%,
      0% 50%,
      42% 40%
    );

  filter:
    drop-shadow(
      0 0 3px #ffffff
    )
    drop-shadow(
      0 0 6px rgba(255, 255, 255, .9)
    );

  animation:
    whiteSparkleSmall
    .9s
    ease-in-out
    infinite
    alternate;

  animation-delay:
    .25s;

  pointer-events:
    none;
}


/* 큰 반짝이 애니메이션 */

@keyframes whiteSparkleBig {

  from {
    transform:
      scale(.58)
      rotate(0deg);

    opacity:
      .48;
  }

  to {
    transform:
      scale(1.22)
      rotate(45deg);

    opacity:
      1;
  }
}


/* 작은 반짝이 애니메이션 */

@keyframes whiteSparkleSmall {

  from {
    transform:
      scale(.5)
      rotate(20deg);

    opacity:
      .35;
  }

  to {
    transform:
      scale(1.15)
      rotate(65deg);

    opacity:
      1;
  }
}


/* =========================================================
   꽃말 확인 완료 표시
========================================================= */

.hotspot.seen::before {
  display: none;
}

.hotspot.seen::after {
  content:
    "✓";

  left:
    calc(100% - 2px);

  top:
    -10px;

  width:
    29px;

  height:
    29px;

  clip-path:
    none;

  border-radius:
    50%;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  background:
    rgba(255, 255, 255, .96);

  color:
    #c87d83;

  font-size:
    15px;

  font-weight:
    bold;

  filter:
    drop-shadow(
      0 2px 5px rgba(70, 40, 40, .18)
    );

  animation:
    none;
}


/* =========================================================
   공통 팝업 배경
========================================================= */

.overlay {
  position: fixed;

  inset: 0;

  padding:
    24px;

  display: none;

  align-items: center;
  justify-content: center;

  background:
    rgba(68, 45, 42, .50);

  backdrop-filter:
    blur(5px);

  -webkit-backdrop-filter:
    blur(5px);

  z-index: 100;
}

.overlay.show {
  display: flex;
}


/* =========================================================
   팝업 카드
========================================================= */

.card {
  width:
    min(330px, 90vw);

  padding:
    28px 22px;

  background:
    rgba(255, 251, 248, .97);

  border-radius:
    28px;

  text-align:
    center;

  box-shadow:
    0 18px 48px rgba(65, 40, 36, .25);
}

.card .emoji {
  font-size:
    35px;
}

.card h2 {
  margin:
    10px 0 8px;

  font-size:
    21px;

  font-weight:
    500;
}

.card p {
  margin:
    0;

  font-size:
    14px;

  line-height:
    1.75;

  color:
    #745853;
}

.card button {
  margin-top:
    19px;

  padding:
    12px 22px;

  border:
    0;

  border-radius:
    999px;

  background:
    #d68a90;

  color:
    #ffffff;

  cursor:
    pointer;
}


/* =========================================================
   꽃말 카드
========================================================= */

.flower-name {
  font-size:
    13px;

  color:
    #b16e73;

  letter-spacing:
    .06em;
}

.flower-meaning {
  margin:
    8px 0 11px;

  font-size:
    21px;

  font-weight:
    600;
}

.flower-message {
  font-size:
    14px;

  line-height:
    1.7;

  color:
    #725853;
}


/* =========================================================
   마지막 축하 화면
========================================================= */

.final-title {
  font-family:
    'Parisienne', cursive;

  font-size:
    36px !important;

  color:
    #aa666d;
}


/* =========================================================
   마지막 꽃잎 / 반짝이
========================================================= */

.spark {
  position:
    fixed;

  top:
    -20px;

  z-index:
    150;

  pointer-events:
    none;

  animation:
    fall linear forwards;
}

@keyframes fall {

  from {
    transform:
      translateY(0)
      rotate(0deg);

    opacity:
      1;
  }

  to {
    transform:
      translateY(110vh)
      rotate(320deg);

    opacity:
      0;
  }
}


/* =========================================================
   작은 모바일 화면 대응
========================================================= */

@media (max-height: 700px) {

  .top {
    height:
      48px;
  }

  .board {
    width:
      min(84vw, 45vh);
  }

  .tray {
    height:
      112px;
  }

  .tray-slot {
    width:
      52px;

    height:
      52px;
  }

  .tray {
    grid-template-columns:
      repeat(8, 52px);

    grid-auto-rows:
      52px;
  }

  .photo-frame {
    width:
      23%;
  }

  .photo-frame::after {
    height:
      100px;
  }

}


/* =========================================================
   아주 좁은 모바일
========================================================= */

@media (max-width: 360px) {

  .start-title {
    font-size:
      42px;
  }

  .top h1 {
    font-size:
      14px;
  }

  .count {
    right:
      10px;

    font-size:
      11px;
  }

  .hotspot::after {
    width:
      28px;

    height:
      28px;
  }

  .hotspot::before {
    width:
      12px;

    height:
      12px;
  }

}
</style>

</head>


<body>


<!-- =====================================================
     START
===================================================== -->

<section
  id="start"
  class="screen active"
>

  <div
    class="start-emoji"
  >
    💐
  </div>

  <div
    class="start-title"
    id="startTitle"
  ></div>

  <div
    class="start-sub"
    id="startSub"
  ></div>

  <button
    class="start-btn"
    id="startBtn"
  ></button>

</section>



<!-- =====================================================
     퍼즐
===================================================== -->

<section
  id="game"
  class="screen"
>

  <div class="top">

    <h1 id="gameTitle"></h1>

    <span
      class="count"
      id="count"
    >
      0 / 16
    </span>

  </div>


  <div class="board-wrap">

    <div
      class="board"
      id="board"
    >

      <div
        class="placeholder"
      ></div>


      <!-- 퍼즐 완성 후 표시 -->

      <div id="completeView">

        <img
          id="completeImg"
          src="bouquet.png"
          alt="완성된 꽃다발"
        />


        <!-- =========================================
             웨딩 사진
        ========================================== -->

        <label
          class="photo-frame"
          id="photoFrame"
          for="photoInput"
        >

          <img
            class="photo-preview"
            id="photoPreview"
            alt="웨딩 사진"
          />


          <div
            class="photo-placeholder"
            id="photoPlaceholder"
          >

            <span>
              📷
            </span>

            웨딩 사진

          </div>

        </label>


        <input
          class="photo-input"
          type="file"
          id="photoInput"
          accept="image/*"
        />

      </div>

    </div>

  </div>


  <div
    class="tray-title"
    id="trayTitle"
  ></div>


  <div
    class="tray"
    id="tray"
  ></div>


  <button
    class="photo-upload-btn"
    id="photoUploadBtn"
  >
  </button>

</section>



<!-- =====================================================
     퍼즐 완성 안내
===================================================== -->

<div
  class="overlay"
  id="guide"
>

  <div class="card">

    <div class="emoji">
      🌷
    </div>

    <h2
      id="guideTitle"
    ></h2>

    <p
      id="guideText"
    ></p>

    <button
      id="guideOk"
    ></button>

  </div>

</div>



<!-- =====================================================
     꽃말
===================================================== -->

<div
  class="overlay"
  id="meaning"
>

  <div class="card">

    <div
      class="flower-name"
      id="mName"
    ></div>

    <div
      class="flower-meaning"
      id="mMeaning"
    ></div>

    <div
      class="flower-message"
      id="mMessage"
    ></div>

    <button
      id="meaningOk"
    ></button>

  </div>

</div>



<!-- =====================================================
     최종 축하
===================================================== -->

<div
  class="overlay"
  id="final"
>

  <div class="card">

    <div class="emoji">
      💐
    </div>

    <h2
      class="final-title"
      id="finalEnglish"
    ></h2>

    <p
      id="finalMain"
      style="
        font-size:20px;
        color:#604641;
        margin-bottom:10px;
      "
    ></p>

    <p
      id="finalSub"
    ></p>

  </div>

</div>



<script>


/* =========================================================

   ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★
   ★
   ★ KIRO에서 문구를 수정하고 싶으면
   ★ 여기 TEXT 부분만 수정하면 됩니다.
   ★
   ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★

========================================================= */


const TEXT = {

  startTitle:
    "For Your Wedding",

  startSub:
    "한 조각씩 완성하는 축하의 마음",

  startButton:
    "START",


  gameTitle:
    "꽃다발 퍼즐을 완성해주세요",

  trayGuide:
    "아래 조각을 빈칸에 끌어다 놓아주세요",

  completeTrayText:
    "✨ 완성 ✨",


  guideTitle:
    "꽃다발이 완성되었어요",

  guideText:
    "꽃을 눌러 꽃말을 확인해보세요. <br> 다섯 가지 꽃말을 모두 확인하면 마지막 축하 메시지가 나타납니다.",

  guideButton:
    "꽃말 확인하기",


  meaningButton:
    "확인",


  photoButton:

/* =========================================================
   4 × 4 퍼즐 생성
========================================================= */


function init() {


  /* 빈칸 16개 만들기 */

  for (
    let r = 0;
    r < 4;
    r++
  ) {


    for (
      let c = 0;
      c < 4;
      c++
    ) {


      const cell =
        document.createElement(
          "div"
        );


      cell.className =
        "cell";


      cell.dataset.index =
        r * 4 + c;


      cell.style.left =
        (c * 25) + "%";


      cell.style.top =
        (r * 25) + "%";


      board.appendChild(
        cell
      );

    }

  }



  /* 0 ~ 15 */

  const order =
    [...Array(16).keys()];



  /* 순서 섞기 */

  for (
    let i = order.length - 1;
    i > 0;
    i--
  ) {


    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );


    [
      order[i],
      order[j]
    ] =
    [
      order[j],
      order[i]
    ];

  }



  /* 아래 퍼즐 조각 생성 */

  order.forEach(
    idx => {


      const r =
        Math.floor(
          idx / 4
        );


      const c =
        idx % 4;



      const slot =
        document.createElement(
          "div"
        );


      slot.className =
        "tray-slot";



      const p =
        document.createElement(
          "div"
        );


      p.className =
        "tray-piece";


      p.dataset.index =
        idx;


      p.style.backgroundPosition =
        `${-c * 100}% ${-r * 100}%`;



      slot.appendChild(
        p
      );


      tray.appendChild(
        slot
      );



      p.addEventListener(
        "pointerdown",
        e =>
          beginDrag(
            e,
            idx,
            slot
          )
      );

    }
  );

}



/* =========================================================
   퍼즐 조각 드래그
========================================================= */


function beginDrag(
  e,
  idx,
  slot
) {


  e.preventDefault();


  const rect =
    board.getBoundingClientRect();


  const r =
    Math.floor(
      idx / 4
    );


  const c =
    idx % 4;



  const piece =
    document.createElement(
      "div"
    );


  piece.className =
    "piece dragging";


  piece.dataset.index =
    idx;


  piece.style.backgroundPosition =
    `${-c * 100}% ${-r * 100}%`;


  board.appendChild(
    piece
  );



  const move =
    ev => {


      piece.style.left =

        (
          (
            ev.clientX -
            rect.left
          )
          /
          rect.width
          *
          100
          -
          12.5
        )
        +
        "%";


      piece.style.top =

        (
          (
            ev.clientY -
            rect.top
          )
          /
          rect.height
          *
          100
          -
          12.5
        )
        +
        "%";

    };



  move(
    e
  );



  const up =
    ev => {


      piece.removeEventListener(
        "pointermove",
        move
      );


      piece.removeEventListener(
        "pointerup",
        up
      );


      piece.removeEventListener(
        "pointercancel",
        up
      );


      piece.classList.remove(
        "dragging"
      );



      const x =

        (
          ev.clientX -
          rect.left
        )
        /
        rect.width;



      const y =

        (
          ev.clientY -
          rect.top
        )
        /
        rect.height;



      const col =
        Math.floor(
          x * 4
        );


      const row =
        Math.floor(
          y * 4
        );


      const target =
        row * 4 + col;



      /* 맞는 위치에 놓았는지 */

      if (

        x >= 0 &&
        x <= 1 &&

        y >= 0 &&
        y <= 1 &&

        target === idx

      ) {


        piece.style.left =
          (c * 25) + "%";


        piece.style.top =
          (r * 25) + "%";


        piece.classList.add(
          "locked"
        );



        document.querySelector(
          `.cell[data-index="${idx}"]`
        ).classList.add(
          "ok"
        );



        slot.remove();



        placed++;



        countEl.textContent =
          placed + " / 16";



        /* 모든 퍼즐 완성 */

        if (
          placed === 16
        ) {


          setTimeout(
            completePuzzle,
            350
          );

        }


      }


      /* 틀린 위치 */

      else {


        piece.remove();

      }

    };



  piece.addEventListener(
    "pointermove",
    move
  );


  piece.addEventListener(
    "pointerup",
    up
  );


  piece.addEventListener(
    "pointercancel",
    up
  );


  piece.setPointerCapture?.(
    e.pointerId
  );

}



/* =========================================================

========================================================= */


function completePuzzle() {


  /* 퍼즐 선과 빈칸 제거 */

  document.querySelectorAll(
    ".piece, .cell, .placeholder"
  ).forEach(
    el =>
      el.style.display =
        "none"
  );



  /* 완성 이미지 표시 */

  document.getElementById(
    "completeView"
  ).style.display =
    "block";



  /* 아래 조각 영역 숨김 */

  document.getElementById(
    "tray"
  ).style.visibility =
    "hidden";



  document.getElementById(
    "trayTitle"
  ).innerHTML =
    TEXT.completeTrayText;



  /* 웨딩 사진 기능 표시 */

  document.getElementById(
    "photoFrame"
  ).classList.add(
    "show"
  );


  document.getElementById(
    "photoUploadBtn"
  ).classList.add(
    "show"
  );



  /* 안내 팝업 */

  setTimeout(
    () => {


      document.getElementById(
        "guide"
      ).classList.add(
        "show"
      );


    },
    350
  );

}

/* =========================================================

function createHotspots() {


  const complete =
    document.getElementById(
      "completeView"
    );


  HOTSPOTS.forEach(
    h => {


      const button =
        document.createElement(
          "button"
        );


      button.className =
        "hotspot";


      button.dataset.type =
        h.type;


      button.style.left =
        h.x + "%";


      button.style.top =
        h.y + "%";


      button.style.width =
        h.size + "%";


      button.style.aspectRatio =
        "1";


      button.onclick =
        () =>
          showMeaning(
            h.type
          );


      complete.appendChild(
        button
      );

    }
  );

}

function showMeaning(
  type
) {


  const m =
    MEANINGS[type];



  document.getElementById(
    "mName"
  ).textContent =
    m.name;



  document.getElementById(
    "mMeaning"
  ).textContent =
    m.meaning;



  document.getElementById(
    "mMessage"
  ).textContent =
    m.message;



  /* 해당 꽃 확인 처리 */

  seen.add(
    type
  );



  document.querySelectorAll(
    `.hotspot[data-type="${type}"]`
  ).forEach(
    hotspot => {


      hotspot.classList.add(
        "seen"
      );


    }
  );



  document.getElementById(
    "meaning"
  ).classList.add(
    "show"
  );

}

          ];

            100
          )
          +
          "vw";


        sparkle.style.animationDuration =

            2.8

          )
          +

          sparkle
        );



        setTimeout(
          () =>
            sparkle.remove(),

        );


      },
      i * 100
    );

  }

}

const photoInput =

    "photoInput"
  );


const photoPreview =
  document.getElementById(
    "photoPreview"
  );


const photoPlaceholder =
  document.getElementById(
    "photoPlaceholder"
  );



/* 버튼 클릭 */

document.getElementById(
  "photoUploadBtn"
).onclick =
  () => {


    photoInput.click();

  };



/* 사진 선택 */

photoInput.addEventListener(
  "change",
  event => {


    const file =
      event.target.files[0];


    if (
      !file
    ) {
      return;
    }



    const reader =
      new FileReader();



    reader.onload =
      e => {


        photoPreview.src =
          e.target.result;


        photoPreview.style.display =
          "block";


        photoPlaceholder.style.display =
          "none";

      };



    reader.readAsDataURL(
      file
    );

  }
);
