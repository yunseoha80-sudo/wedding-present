<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Wedding Flower Puzzle</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Parisienne&display=swap');


/* =========================================================
   기본 설정
========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #fff8f4;
    color: #513c38;

    font-family: 'Gowun Dodum', sans-serif;
}

button {
    font: inherit;
}

.screen {
    position: fixed;
    inset: 0;
    display: none;
}

.screen.active {
    display: flex;
}


/* =========================================================
   START 화면
========================================================= */

#start {

    align-items: center;
    justify-content: center;
    flex-direction: column;

    text-align: center;

    padding: 24px;

    background:

        radial-gradient(
            circle at 30% 18%,
            rgba(255,255,255,.98),
            rgba(255,255,255,0) 30%
        ),

        linear-gradient(
            160deg,
            #fffaf6 0%,
            #fbe9e8 57%,
            #f5d6d5 100%
        );
}


.start-emoji {

    font-size: 56px;

    animation:
        float 2.8s ease-in-out infinite;
}


.start-title {

    margin-top: 12px;

    font-family:
        'Parisienne',
        cursive;

    font-size: 42px;

    color: #b56f75;

    text-align: center;
   
    width: 100%;
   
    line-height:1.15;
   
}


.start-sub {

    margin:
        2px 0 32px;

    font-size: 14px;

    color: #98706c;
}


.start-btn {

    width: 154px;
    height: 54px;

    border:
        1px solid #daa1a4;

    border-radius:
        999px;

    background:
        rgba(255,255,255,.72);

    color:
        #9e6266;

    letter-spacing:
        3px;

    font-size:
        17px;

    box-shadow:
        0 12px 30px
        rgba(139,83,88,.16);

    cursor: pointer;
}


@keyframes float {

    0%,
    100% {
        transform:
            translateY(0);
    }

    50% {
        transform:
            translateY(-8px);
    }

}


/* =========================================================
   퍼즐 화면
========================================================= */

#game {

    flex-direction: column;

    background:

        linear-gradient(
            #fffaf7,
            #fff2ec
        );
}


/* 상단 */

.top {

    position: relative;

    height: 58px;

    display: flex;

    align-items: center;
    justify-content: center;
}


.top h1 {

    margin: 0;

    font-size: 16px;

    font-weight: 500;
}


.count {

    position: absolute;

    right: 16px;

    font-size: 12px;

    color: #a87975;
}


/* =========================================================
   퍼즐판
========================================================= */

.board-wrap {

    flex: 1;

    min-height: 0;

    padding:
        0 14px 8px;

    display: flex;

    align-items: center;
    justify-content: center;
}


.board {

    position: relative;

    width:
        min(92vw, 48vh);

    aspect-ratio:
        451 / 736;

    background:
        #f4e8df;

    border-radius:
        18px;

    overflow: hidden;

    box-shadow:

        0 12px 34px
        rgba(114,75,68,.15),

        inset 0 0 0 1px
        rgba(178,135,126,.14);
}


/* 빈 퍼즐판 */

.placeholder {

    position: absolute;

    inset: 0;

    background:

        linear-gradient(
            rgba(255,255,255,.23),
            rgba(255,255,255,.23)
        ),

        radial-gradient(
            circle at 50% 35%,
            #fffaf7,
            #f7e7dc
        );
}


/* =========================================================
   4 × 4 퍼즐 칸
========================================================= */

.cell {

    position: absolute;

    width: 25%;
    height: 25%;

    border:
        .5px solid
        rgba(153,112,105,.28);
}


.cell.ok {

    border-color:
        rgba(255,255,255,.1);
}


/* =========================================================
   퍼즐 조각
========================================================= */

.piece {

    position: absolute;

    width: 25%;
    height: 25%;

    background-image:
        url('bouquet.png');

    background-size:
        400% 400%;

    z-index: 10;

    touch-action: none;

    user-select: none;

    box-shadow:

        0 2px 7px
        rgba(79,50,45,.22);

    transition:

        transform .12s ease,

        box-shadow .12s ease;
}


.piece.dragging {

    z-index: 50;

    transform:
        scale(1.05);

    box-shadow:

        0 10px 24px
        rgba(75,46,41,.3);

    transition: none;
}


.piece.locked {

    pointer-events: none;

    box-shadow: none;
}


.piece::after {

    content: "";

    position: absolute;

    inset: 0;

    border:

        1px solid
        rgba(255,255,255,.38);

    pointer-events: none;
}


/* =========================================================
   아래 퍼즐 조각
========================================================= */

.tray-title {

    margin:
        0 0 5px;

    text-align: center;

    font-size: 12px;

    color: #9c7771;
}


.tray {

    height: 132px;

    padding:
        4px 12px 15px;

    display: grid;

    grid-template-columns:
        repeat(8,58px);

    grid-auto-rows:
        58px;

    gap: 8px;

    overflow-x: auto;
    overflow-y: hidden;

    scrollbar-width: none;

    align-content: center;
}


.tray::-webkit-scrollbar {

    display: none;
}


.tray-slot {

    position: relative;

    width: 58px;
    height: 58px;

    overflow: hidden;

    border-radius: 14px;

    background: #ffffff;

    border:
        1px solid #f0ddd6;

    box-shadow:

        0 4px 14px
        rgba(123,80,73,.1);
}


.tray-piece {

    position: absolute;

    inset: 0;

    background-image:
        url('bouquet.png');

    background-size:
        400% 400%;

    touch-action: none;
}


/* =========================================================
   완성된 꽃다발
========================================================= */

#completeView {

    position: absolute;

    inset: 0;

    z-index: 20;

    display: none;
}


#completeImg {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;
}


/* =========================================================
   꽃말 클릭 영역
========================================================= */

.hotspot {

    position: absolute;

    transform:
        translate(-50%,-50%);

    border: 0;

    border-radius: 50%;

    background:
        rgba(255,255,255,.04);

    z-index: 40;

    cursor: pointer;

    /*
       꽃 주변 자체가 은은하게 빛나서
       클릭할 위치를 쉽게 찾을 수 있음
    */

    box-shadow:

        0 0 0 7px
        rgba(255,255,255,.18),

        0 0 18px 8px
        rgba(255,255,255,.34);

    animation:

        hotspotGlow
        1.2s
        ease-in-out
        infinite alternate;
}


/* =========================================================
   큰 흰색 반짝이
========================================================= */

.hotspot::after {

    content: "";

    position: absolute;

    right: -20px;
    top: -22px;

    width: 38px;
    height: 38px;

    background:
        #ffffff;

    clip-path:

        polygon(

            50% 0%,

            58% 39%,

            100% 50%,

            58% 61%,

            50% 100%,

            42% 61%,

            0% 50%,

            42% 39%

        );

    filter:

        drop-shadow(
            0 0 4px
            #ffffff
        )

        drop-shadow(
            0 0 10px
            rgba(255,255,255,1)
        )

        drop-shadow(
            0 0 18px
            rgba(255,255,255,.85)
        );

    animation:

        sparkleBig
        .95s
        ease-in-out
        infinite alternate;

    pointer-events: none;
}


/* =========================================================
   작은 흰색 반짝이
========================================================= */

.hotspot::before {

    content: "";

    position: absolute;

    left: -15px;
    bottom: -13px;

    width: 18px;
    height: 18px;

    background:
        #ffffff;

    clip-path:

        polygon(

            50% 0%,

            58% 39%,

            100% 50%,

            58% 61%,

            50% 100%,

            42% 61%,

            0% 50%,

            42% 39%

        );

    filter:

        drop-shadow(
            0 0 4px
            #ffffff
        )

        drop-shadow(
            0 0 9px
            rgba(255,255,255,.95)
        );

    animation:

        sparkleSmall
        .8s
        ease-in-out
        infinite alternate;

    animation-delay:
        .25s;

    pointer-events: none;
}


/* 꽃 주변 빛 */

@keyframes hotspotGlow {

    from {

        box-shadow:

            0 0 0 4px
            rgba(255,255,255,.10),

            0 0 10px 3px
            rgba(255,255,255,.20);
    }

    to {

        box-shadow:

            0 0 0 10px
            rgba(255,255,255,.28),

            0 0 25px 10px
            rgba(255,255,255,.55);
    }

}


/* 큰 반짝이 */

@keyframes sparkleBig {

    from {

        transform:
            scale(.65)
            rotate(0deg);

        opacity:
            .5;
    }

    to {

        transform:
            scale(1.3)
            rotate(45deg);

        opacity:
            1;
    }

}


/* 작은 반짝이 */

@keyframes sparkleSmall {

    from {

        transform:
            scale(.55)
            rotate(10deg);

        opacity:
            .4;
    }

    to {

        transform:
            scale(1.2)
            rotate(55deg);

        opacity:
            1;
    }

}


/* =========================================================
   꽃말 확인 완료
========================================================= */

.hotspot.seen {

    animation: none;

    box-shadow:

        0 0 0 4px
        rgba(255,255,255,.12);
}


.hotspot.seen::before {

    display: none;
}


.hotspot.seen::after {

    content: "✓";

    right: -10px;
    top: -10px;

    width: 31px;
    height: 31px;

    clip-path: none;

    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        rgba(255,255,255,.97);

    color:
        #c87d83;

    font-size: 16px;

    font-weight: bold;

    filter:

        drop-shadow(
            0 2px 6px
            rgba(70,40,40,.18)
        );

    animation: none;
}


/* =========================================================
   팝업 배경
========================================================= */

.overlay {

    position: fixed;

    inset: 0;

    padding: 24px;

    display: none;

    align-items: center;
    justify-content: center;

    background:

        rgba(68,45,42,.50);

    backdrop-filter:
        blur(5px);

    -webkit-backdrop-filter:
        blur(5px);

    z-index: 100;
}


.overlay.show {

    display: flex;
}


/* =========================================================
   팝업 카드
========================================================= */

.card {

    width:
        min(330px,90vw);

    padding:
        28px 22px;

    background:
        rgba(255,251,248,.97);

    border-radius:
        28px;

    text-align: center;

    box-shadow:

        0 18px 48px
        rgba(65,40,36,.25);
}


.card .emoji {

    font-size: 35px;
}


.card h2 {

    margin:
        10px 0 8px;

    font-size: 21px;

    font-weight: 500;
}


.card p {

    margin: 0;

    font-size: 14px;

    line-height: 1.75;

    color: #745853;
}


.card button {

    margin-top: 19px;

    padding:
        12px 22px;

    border: 0;

    border-radius:
        999px;

    background:
        #d68a90;

    color: #ffffff;

    cursor: pointer;
}


/* =========================================================
   꽃말
========================================================= */

.flower-name {

    font-size: 13px;

    color: #b16e73;

    letter-spacing:
        .06em;
}


.flower-meaning {

    margin:
        8px 0 11px;

    font-size: 21px;

    font-weight: 600;
}


.flower-message {

    font-size: 14px;

    line-height: 1.7;

    color: #725853;
}


/* =========================================================
   마지막 축하
========================================================= */

.final-title {

    font-family:
        'Parisienne',
        cursive;

    font-size:
        36px !important;

    color:
        #aa666d;
}


/* =========================================================
   마지막 애니메이션
========================================================= */

.spark {

    position: fixed;

    top: -20px;

    z-index: 150;

    pointer-events: none;

    animation:
        fall linear forwards;
}


@keyframes fall {

    from {

        transform:
            translateY(0)
            rotate(0deg);

        opacity:
            1;
    }

    to {

        transform:
            translateY(110vh)
            rotate(320deg);

        opacity:
            0;
    }

}


/* =========================================================
   작은 모바일
========================================================= */

@media (max-height:700px) {

    .top {
        height: 48px;
    }

    .board {

        width:
            min(84vw,45vh);
    }

    .tray {

        height:
            112px;

        grid-template-columns:
            repeat(8,52px);

        grid-auto-rows:
            52px;
    }

    .tray-slot {

        width:
            52px;

        height:
            52px;
    }

}


@media (max-width:360px) {

    .start-title {

        font-size:
            42px;
    }

    .top h1 {

        font-size:
            14px;
    }

    .count {

        right:
            10px;

        font-size:
            11px;
    }

    .hotspot::after {

        width:
            33px;

        height:
            33px;
    }

    .hotspot::before {

        width:
            16px;

        height:
            16px;
    }

}

</style>
</head>


<body>

     START

    setTimeout(
        init,
        30
    );

};



/* =========================================================
   퍼즐 생성
========================================================= */

function init() {


    /* 4 × 4 빈칸 생성 */

    for (
        let r = 0;
        r < 4;
        r++
    ) {


        for (
            let c = 0;
            c < 4;
            c++
        ) {


            const cell =
                document.createElement(
                    "div"
                );


            cell.className =
                "cell";


            cell.dataset.index =
                r * 4 + c;


            cell.style.left =
                (c * 25) + "%";


            cell.style.top =
                (r * 25) + "%";


            board.appendChild(
                cell
            );

        }

    }



    /* 16개 조각 */

    const order =
        [...Array(16).keys()];



    /* 랜덤 섞기 */

    for (
        let i = order.length - 1;
        i > 0;
        i--
    ) {


        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            order[i],
            order[j]
        ] =
        [
            order[j],
            order[i]
        ];

    }



    /* 퍼즐 조각 생성 */

    order.forEach(
        idx => {


            const r =
                Math.floor(
                    idx / 4
                );


            const c =
                idx % 4;



            const slot =
                document.createElement(
                    "div"
                );


            slot.className =
                "tray-slot";



            const p =
                document.createElement(
                    "div"
                );


            p.className =
                "tray-piece";


            p.dataset.index =
                idx;


            p.style.backgroundPosition =
                `${-c * 100}% ${-r * 100}%`;



            slot.appendChild(
                p
            );


            tray.appendChild(
                slot
            );



            p.addEventListener(
                "pointerdown",
                e =>
                    beginDrag(
                        e,
                        idx,
                        slot
                    )
            );

        }
    );

}



/* =========================================================
   퍼즐 드래그
========================================================= */

function beginDrag(
    e,
    idx,
    slot
) {


    e.preventDefault();


    const rect =
        board.getBoundingClientRect();


    const r =
        Math.floor(
            idx / 4
        );


    const c =
        idx % 4;



    const piece =
        document.createElement(
            "div"
        );


    piece.className =
        "piece dragging";


    piece.dataset.index =
        idx;


    piece.style.backgroundPosition =
        `${-c * 100}% ${-r * 100}%`;


    board.appendChild(
        piece
    );



    const move =
        ev => {


            piece.style.left =

                (
                    (
                        ev.clientX -
                        rect.left
                    )
                    /
                    rect.width
                    *
                    100
                    -
                    12.5
                )
                +
                "%";


            piece.style.top =

                (
                    (
                        ev.clientY -
                        rect.top
                    )
                    /
                    rect.height
                    *
                    100
                    -
                    12.5
                )
                +
                "%";

        };



    move(
        e
    );



    const up =
        ev => {


            piece.removeEventListener(
                "pointermove",
                move
            );


            piece.removeEventListener(
                "pointerup",
                up
            );


            piece.removeEventListener(
                "pointercancel",
                up
            );


            piece.classList.remove(
                "dragging"
            );



            const x =

                (
                    ev.clientX -
                    rect.left
                )
                /
                rect.width;



            const y =

                (
                    ev.clientY -
                    rect.top
                )
                /
                rect.height;



            const col =
                Math.floor(
                    x * 4
                );


            const row =
                Math.floor(
                    y * 4
                );


            const target =
                row * 4 + col;



            /* 맞는 위치 */

            if (

                x >= 0 &&
                x <= 1 &&

                y >= 0 &&
                y <= 1 &&

                target === idx

            ) {


                piece.style.left =
                    (c * 25) + "%";


                piece.style.top =
                    (r * 25) + "%";


                piece.classList.add(
                    "locked"
                );



                document.querySelector(
                    `.cell[data-index="${idx}"]`
                ).classList.add(
                    "ok"
                );



                slot.remove();



                placed++;



                countEl.textContent =
                    placed + " / 16";



                /* 16개 완성 */

                if (
                    placed === 16
                ) {


                    setTimeout(
                        completePuzzle,
                        350
                    );

                }


            }


            /* 틀린 위치 */

            else {


                piece.remove();

            }

        };



    piece.addEventListener(
        "pointermove",
        move
    );


    piece.addEventListener(
        "pointerup",
        up
    );


    piece.addEventListener(
        "pointercancel",
        up
    );


    piece.setPointerCapture?.(
        e.pointerId
    );

}



/* =========================================================
   퍼즐 완성
========================================================= */

function completePuzzle() {


    /*
       퍼즐 조각 선을 모두 없애고
       원본 꽃다발을 보여줌
    */

    document.querySelectorAll(
        ".piece, .cell, .placeholder"
    ).forEach(
        el =>
            el.style.display =
                "none"
    );



    document.getElementById(
        "completeView"
    ).style.display =
        "block";



    document.getElementById(
        "tray"
    ).style.visibility =
        "hidden";



    document.getElementById(
        "trayTitle"
    ).innerHTML =
        TEXT.completeTrayText;



    /* 안내창 */

    setTimeout(
        () => {


            document.getElementById(
                "guide"
            ).classList.add(
                "show"
            );


        },
        350
    );

}



/* =========================================================
   꽃말 확인 시작
========================================================= */

document.getElementById(
    "guideOk"
).onclick = () => {


    document.getElementById(
        "guide"
    ).classList.remove(
        "show"
    );


    createHotspots();

};



/* =========================================================
   반짝이 생성
========================================================= */

function createHotspots() {


    const complete =
        document.getElementById(
            "completeView"
        );


    HOTSPOTS.forEach(
        h => {


            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "hotspot";


            button.dataset.type =
                h.type;


            button.style.left =
                h.x + "%";


            button.style.top =
                h.y + "%";


            button.style.width =
                h.size + "%";


            button.style.aspectRatio =
                "1";


            button.setAttribute(
                "aria-label",
                MEANINGS[h.type].name +
                " 꽃말 확인"
            );


            button.onclick =
                () =>
                    showMeaning(
                        h.type
                    );


            complete.appendChild(
                button
            );

        }
    );

}



/* =========================================================
   꽃말 표시
========================================================= */

function showMeaning(
    type
) {


    const m =
        MEANINGS[type];



    document.getElementById(
        "mName"
    ).textContent =
        m.name;



    document.getElementById(
        "mMeaning"
    ).textContent =
        m.meaning;



    document.getElementById(
        "mMessage"
    ).textContent =
        m.message;



    /* 확인한 꽃 저장 */

    seen.add(
        type
    );



    /* 해당 꽃 ✓ 표시 */

    document.querySelectorAll(
        `.hotspot[data-type="${type}"]`
    ).forEach(
        hotspot => {


            hotspot.classList.add(
                "seen"
            );


        }
    );



    document.getElementById(
        "meaning"
    ).classList.add(
        "show"
    );

}



/* =========================================================
   꽃말 팝업 닫기
========================================================= */

document.getElementById(
    "meaningOk"
).onclick =
    () => {


        document.getElementById(
            "meaning"
        ).classList.remove(
            "show"
        );


        /*
           다섯 종류의 꽃말을
           모두 확인했을 경우
        */

        if (
            seen.size === 5
        ) {


            setTimeout(
                showFinal,
                350
            );

        }

    };



/* =========================================================
   마지막 결혼 축하
========================================================= */

function showFinal() {


    document.getElementById(
        "final"
    ).classList.add(
        "show"
    );



    /* 꽃잎 / 반짝이 떨어지는 효과 */

    for (
        let i = 0;
        i < 24;
        i++
    ) {


        setTimeout(
            () => {


                const sparkle =
                    document.createElement(
                        "div"
                    );


                sparkle.className =
                    "spark";


                sparkle.textContent =

                    [
                        "🌸",
                        "✨",
                        "🤍",
                        "🌷"
                    ]
                    [
                        Math.floor(
                            Math.random() * 4
                        )
                    ];



                sparkle.style.left =
                    (
                        Math.random()
                        *
                        100
                    )
                    +
                    "vw";


                sparkle.style.animationDuration =
                    (
                        2.8
                        +
                        Math.random()
                        *
                        1.8
                    )
                    +
                    "s";


                document.body.appendChild(
                    sparkle
                );



                setTimeout(
                    () =>
                        sparkle.remove(),
                    5000
                );


            },
            i * 100
        );

    }

}


</script>
