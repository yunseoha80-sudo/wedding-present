<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Wedding Flower Puzzle</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Parisienne&display=swap');

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #fff8f4;
  color: #513c38;
  font-family: 'Gowun Dodum', sans-serif;
}

button {
  font: inherit;
}

.screen {
  position: fixed;
  inset: 0;
  display: none;
}

.screen.active {
  display: flex;
}


/* =========================================================
   START 화면
========================================================= */

#start {
  align-items: center;
  justify-content: center;
  flex-direction: column;
  padding: 24px;

  background:
    radial-gradient(
      circle at 30% 18%,
      rgba(255,255,255,.98),
      rgba(255,255,255,0) 30%
    ),
    linear-gradient(
      160deg,
      #fffaf6 0%,
      #fbe9e8 57%,
      #f5d6d5 100%
    );
}

.start-emoji {
  font-size: 56px;
  animation: float 2.8s ease-in-out infinite;
}

.start-title {
  font-family: 'Parisienne', cursive;
  font-size: 48px;
  color: #b56f75;
  margin-top: 12px;
}

.start-sub {
  font-size: 14px;
  color: #98706c;
  margin: 2px 0 32px;
}

.start-btn {
  width: 154px;
  height: 54px;

  border-radius: 999px;
  border: 1px solid #daa1a4;

  background: rgba(255,255,255,.72);
  color: #9e6266;

  letter-spacing: 3px;
  font-size: 17px;

  box-shadow: 0 12px 30px rgba(139,83,88,.16);
}

@keyframes float {
  50% {
    transform: translateY(-8px);
  }
}


/* =========================================================
   퍼즐 화면
========================================================= */

#game {
  flex-direction: column;
  background: linear-gradient(#fffaf7,#fff2ec);
}

.top {
  height: 58px;

  display: flex;
  align-items: center;
  justify-content: center;

  position: relative;
}

.top h1 {
  font-size: 16px;
  font-weight: 500;
  margin: 0;
}

.count {
  position: absolute;
  right: 16px;

  font-size: 12px;
  color: #a87975;
}


/* 퍼즐 판 */

.board-wrap {
  flex: 1;
  min-height: 0;

  padding: 0 14px 8px;

  display: flex;
  align-items: center;
  justify-content: center;
}

.board {
  position: relative;

  width: min(92vw, 48vh);
  aspect-ratio: 451 / 736;

  background: #f4e8df;

  border-radius: 18px;
  overflow: hidden;

  box-shadow:
    0 12px 34px rgba(114,75,68,.15),
    inset 0 0 0 1px rgba(178,135,126,.14);
}


/* 빈 퍼즐 배경 */

.placeholder {
  position: absolute;
  inset: 0;

  background:
    linear-gradient(
      rgba(255,255,255,.23),
      rgba(255,255,255,.23)
    ),
    radial-gradient(
      circle at 50% 35%,
      #fffaf7,
      #f7e7dc
    );
}


/* 4 × 4 퍼즐 칸 */

.cell {
  position: absolute;

  width: 25%;
  height: 25%;

  border: .5px solid rgba(153,112,105,.28);
}

.cell.ok {
  border-color: rgba(255,255,255,.1);
}


/* 실제 퍼즐 조각 */

.piece {
  position: absolute;

  width: 25%;
  height: 25%;

  background-image: url('bouquet.png');
  background-size: 400% 400%;

  z-index: 10;

  touch-action: none;
  user-select: none;

  box-shadow: 0 2px 7px rgba(79,50,45,.22);

  transition:
    transform .12s ease,
    box-shadow .12s ease;
}

.piece.dragging {
  z-index: 50;

  transform: scale(1.05);

  box-shadow:
    0 10px 24px rgba(75,46,41,.3);

  transition: none;
}

.piece.locked {
  pointer-events: none;
  box-shadow: none;
}

.piece::after {
  content: '';

  position: absolute;
  inset: 0;

  border:
    1px solid rgba(255,255,255,.38);

  pointer-events: none;
}


/* 퍼즐 조각 보관 영역 */

.tray-title {
  text-align: center;

  font-size: 12px;
  color: #9c7771;

  margin: 0 0 5px;
}

.tray {
  height: 132px;

  padding: 4px 12px 15px;

  display: grid;

  grid-template-columns:
    repeat(8,58px);

  grid-auto-rows: 58px;

  gap: 8px;

  overflow-x: auto;
  overflow-y: hidden;

  scrollbar-width: none;

  align-content: center;
}

.tray::-webkit-scrollbar {
  display: none;
}

.tray-slot {
  width: 58px;
  height: 58px;

  border-radius: 14px;

  background: #fff;

  box-shadow:
    0 4px 14px rgba(123,80,73,.1);

  position: relative;

  overflow: hidden;

  border:
    1px solid #f0ddd6;
}

.tray-piece {
  position: absolute;
  inset: 0;

  background-image:
    url('bouquet.png');

  background-size:
    400% 400%;

  touch-action: none;
}


/* =========================================================
   퍼즐 완성 후 화면
========================================================= */

#completeView {
  position: absolute;
  inset: 0;

  z-index: 20;

  display: none;
}

#completeImg {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;
}


/* =========================================================
   꽃말 클릭 영역
========================================================= */

.hotspot {
  position: absolute;

  transform:
    translate(-50%, -50%);

  border: 0;

  background:
    transparent;

  border-radius: 50%;

  z-index: 40;
}


/* ★ 꽃 옆 큰 반짝이 */

.hotspot::after {
  content: '✨';

  position: absolute;

  right: -15px;
  top: -19px;

  font-size: 32px;

  line-height: 1;

  filter:
    drop-shadow(
      0 2px 6px rgba(255,255,255,.95)
    );

  animation:
    sparklePulse 1.15s ease-in-out
    infinite alternate;

  pointer-events: none;
}

@keyframes sparklePulse {

  from {
    transform:
      scale(.8)
      rotate(-8deg);

    opacity: .7;
  }

  to {
    transform:
      scale(1.22)
      rotate(8deg);

    opacity: 1;
  }

}


/* 꽃말 확인 완료 */

.hotspot.seen::after {
  content: '✓';

  right: -9px;
  top: -9px;

  width: 28px;
  height: 28px;

  border-radius: 50%;

  display: flex;

  align-items: center;
  justify-content: center;

  background: #cf7f86;

  color: white;

  font-size: 15px;

  animation: none;
}


/* =========================================================
   웨딩 사진 영역
========================================================= */

.photo-frame {

  position: absolute;

  left: 50%;
  top: 61%;

  transform:
    translate(-50%,-50%)
    rotate(-2deg);

  width: 31%;

  aspect-ratio:
    3 / 4;

  z-index: 30;

  background:
    rgba(255,255,255,.96);

  padding:
    5px 5px 18px;

  border-radius: 5px;

  box-shadow:
    0 7px 20px rgba(76,45,39,.22);

  display: none;
}


/* 퍼즐 완성 후에만 표시 */

.photo-frame.show {
  display: block;
}


/* 실제 업로드 사진 */

.photo-preview {

  width: 100%;
  height: 100%;

  object-fit: cover;

  border-radius: 2px;

  display: none;
}


/* 사진 선택 전 */

.photo-placeholder {

  width: 100%;
  height: 100%;

  border:
    1px dashed #d9aca9;

  background:
    rgba(255,247,244,.92);

  color: #b27876;

  font-size: 11px;

  display: flex;

  flex-direction: column;

  align-items: center;
  justify-content: center;

  gap: 4px;

  text-align: center;
}

.photo-placeholder span {
  font-size: 20px;
}


/* 실제 file input 숨김 */

.photo-input {
  display: none;
}


/* 웨딩 사진 넣기 버튼 */

.photo-upload-btn {

  position: absolute;

  left: 50%;

  bottom: 16px;

  transform:
    translateX(-50%);

  z-index: 45;

  border:
    1px solid rgba(216,153,154,.65);

  background:
    rgba(255,250,247,.96);

  color:
    #9f6869;

  border-radius:
    999px;

  padding:
    10px 17px;

  font-size:
    12px;

  box-shadow:
    0 5px 15px rgba(100,60,55,.13);

  display:
    none;
}

.photo-upload-btn.show {
  display: block;
}


/* =========================================================
   팝업
========================================================= */

.overlay {

  position: fixed;
  inset: 0;

  background:
    rgba(68,45,42,.50);

  backdrop-filter:
    blur(5px);

  display: none;

  align-items: center;
  justify-content: center;

  padding: 24px;

  z-index: 100;
}

.overlay.show {
  display: flex;
}

.card {

  width:
    min(330px,90vw);

  background:
    rgba(255,251,248,.97);

  border-radius:
    28px;

  padding:
    28px 22px;

  text-align:
    center;

  box-shadow:
    0 18px 48px rgba(65,40,36,.25);
}

.card .emoji {
  font-size: 35px;
}

.card h2 {

  font-size: 21px;

  font-weight: 500;

  margin:
    10px 0 8px;
}

.card p {

  font-size: 14px;

  line-height:
    1.75;

  color:
    #745853;

  margin:
    0;
}

.card button {

  border: 0;

  background:
    #d68a90;

  color:
    white;

  border-radius:
    999px;

  padding:
    12px 22px;

  margin-top:
    19px;
}


/* 꽃말 카드 */

.flower-name {

  font-size:
    13px;

  color:
    #b16e73;

  letter-spacing:
    .06em;
}

.flower-meaning {

  font-size:
    21px;

  font-weight:
    600;

  margin:
    8px 0 11px;
}

.flower-message {

  font-size:
    14px;

  line-height:
    1.7;

  color:
    #725853;
}


/* 마지막 축하 */

.final-title {

  font-family:
    'Parisienne', cursive;

  font-size:
    36px !important;

  color:
    #aa666d;
}


/* 떨어지는 꽃/반짝이 */

.spark {

  position:
    fixed;

  top:
    -20px;

  z-index:
    150;

  pointer-events:
    none;

  animation:
    fall linear forwards;
}

@keyframes fall {

  to {

    transform:
      translateY(110vh)
      rotate(320deg);

    opacity:
      0;

  }

}

</style>
</head>


<body>

<script>


/* =========================================================

const TEXT = {

  startTitle:
    "For Your Wedding",

  startSub:
    "한 조각씩 완성하는 축하의 마음",

  completeTrayText:

  guideTitle:

  guideButton:

  meaningButton:

  photoButton:

  finalEnglish:
    "Congratulations",

  finalMain:
    "결혼을 진심으로 축하드립니다",

  finalSub:
    "두 분의 새로운 시작에<br>사랑과 행복이 오래도록 피어나길 바랍니다."

};



/* =========================================================

   ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★
   ★
   ★ 꽃 이름 / 꽃말 / 축하 메시지
   ★ 여기에서 수정하면 됩니다.
   ★
   ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★

========================================================= */


const MEANINGS = {


  /* 리시안셔스 */

  lisianthus: {

    name:
      "리시안셔스",

    meaning:
      "변치 않는 사랑, 감사",

    message:
      "두 분의 사랑이 오래도록 변치 않고, 서로에게 늘 감사가 되는 날들이 이어지길 바랍니다."

  },


  /* 스위트피 */

  sweetpea: {

    meaning:

    message:

  },

  },


  /* 핑크 장미 */

      "핑크 장미",

    meaning:
      "행복, 감사, 우아함",

    message:
      "서로를 향한 감사와 행복이 두 분의 일상에 오래도록 피어나길 바랍니다."

  gerbera: {

    message:

};



/* =========================================================

   ★ 꽃말을 확인할 꽃들의 위치

   x = 왼쪽에서 몇 %
   y = 위에서 몇 %
   size = 터치 영역 크기

   예:
   x 값을 키우면 → 오른쪽 이동
   x 값을 줄이면 → 왼쪽 이동

   y 값을 키우면 → 아래 이동
   y 값을 줄이면 → 위 이동

========================================================= */


const HOTSPOTS = [

    type: "rose",

  },

  {

    y: 33,

  }

];

/* =========================================================
   기본 변수
========================================================= */


const board =
  document.getElementById(
    "board"
  );


const tray =
  document.getElementById(
    "tray"
  );


const countEl =
  document.getElementById(
    "count"
  );


let placed = 0;


const seen =
  new Set();



/* =========================================================
   START 버튼
========================================================= */


document.getElementById(
  "startBtn"
).onclick = () => {


  document.getElementById(
    "start"
  ).classList.remove(
    "active"
  );


  document.getElementById(
    "game"
  ).classList.add(
    "active"
  );


  setTimeout(
    init,
    30
  );

};



/* =========================================================
   4 × 4 퍼즐 생성
========================================================= */


function init() {


  /* 빈칸 16개 만들기 */

  for (
    let r = 0;
    r < 4;
    r++
  ) {


    for (
      let c = 0;
      c < 4;
      c++
    ) {


      const cell =
        document.createElement(
          "div"
        );


      cell.className =
        "cell";


      cell.dataset.index =
        r * 4 + c;


      cell.style.left =
        (c * 25) + "%";


      cell.style.top =
        (r * 25) + "%";


      board.appendChild(
        cell
      );

    }

  }



  /* 0 ~ 15 */

  const order =
    [...Array(16).keys()];



  /* 순서 섞기 */

  for (
    let i = order.length - 1;
    i > 0;
    i--
  ) {


    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );


    [
      order[i],
      order[j]
    ] =
    [
      order[j],
      order[i]
    ];

  }



  /* 아래 퍼즐 조각 생성 */

  order.forEach(
    idx => {


      const r =
        Math.floor(
          idx / 4
        );


      const c =
        idx % 4;



      const slot =
        document.createElement(
          "div"
        );


      slot.className =
        "tray-slot";



      const p =
        document.createElement(
          "div"
        );


      p.className =
        "tray-piece";


      p.dataset.index =
        idx;


      p.style.backgroundPosition =
        `${-c * 100}% ${-r * 100}%`;



      slot.appendChild(
        p
      );


      tray.appendChild(
        slot
      );



      p.addEventListener(
        "pointerdown",
        e =>
          beginDrag(
            e,
            idx,
            slot
          )
      );

    }
  );

}



/* =========================================================
   퍼즐 조각 드래그
========================================================= */


function beginDrag(
  e,
  idx,
  slot
) {


  e.preventDefault();


  const rect =
    board.getBoundingClientRect();


  const r =
    Math.floor(
      idx / 4
    );


  const c =
    idx % 4;



  const piece =
    document.createElement(
      "div"
    );


  piece.className =
    "piece dragging";


  piece.dataset.index =
    idx;


  piece.style.backgroundPosition =
    `${-c * 100}% ${-r * 100}%`;


  board.appendChild(
    piece
  );



  const move =
    ev => {


      piece.style.left =

        (
          (
            ev.clientX -
            rect.left
          )
          /
          rect.width
          *
          100
          -
          12.5
        )
        +
        "%";


      piece.style.top =

        (
          (
            ev.clientY -
            rect.top
          )
          /
          rect.height
          *
          100
          -
          12.5
        )
        +
        "%";

    };



  move(
    e
  );



  const up =
    ev => {


      piece.removeEventListener(
        "pointermove",
        move
      );


      piece.removeEventListener(
        "pointerup",
        up
      );


      piece.removeEventListener(
        "pointercancel",
        up
      );


      piece.classList.remove(
        "dragging"
      );



      const x =

        (
          ev.clientX -
          rect.left
        )
        /
        rect.width;



      const y =

        (
          ev.clientY -
          rect.top
        )
        /
        rect.height;



      const col =
        Math.floor(
          x * 4
        );


      const row =
        Math.floor(
          y * 4
        );


      const target =
        row * 4 + col;



      /* 맞는 위치에 놓았는지 */

      if (

        x >= 0 &&
        x <= 1 &&

        y >= 0 &&
        y <= 1 &&

        target === idx

      ) {


        piece.style.left =
          (c * 25) + "%";


        piece.style.top =
          (r * 25) + "%";


        piece.classList.add(
          "locked"
        );



        document.querySelector(
          `.cell[data-index="${idx}"]`
        ).classList.add(
          "ok"
        );



        slot.remove();



        placed++;



        countEl.textContent =
          placed + " / 16";



        /* 모든 퍼즐 완성 */

        if (
          placed === 16
        ) {


          setTimeout(
            completePuzzle,
            350
          );

        }


      }


      /* 틀린 위치 */

      else {


        piece.remove();

      }

    };



  piece.addEventListener(
    "pointermove",
    move
  );


  piece.addEventListener(
    "pointerup",
    up
  );


  piece.addEventListener(
    "pointercancel",
    up
  );


  piece.setPointerCapture?.(
    e.pointerId
  );

}



/* =========================================================
   퍼즐 완성
========================================================= */


function completePuzzle() {


  /* 퍼즐 선과 빈칸 제거 */

  document.querySelectorAll(
    ".piece, .cell, .placeholder"
  ).forEach(
    el =>
      el.style.display =
        "none"
  );



  /* 완성 이미지 표시 */

  document.getElementById(
    "completeView"
  ).style.display =
    "block";



  /* 아래 조각 영역 숨김 */

  document.getElementById(
    "tray"
  ).style.visibility =
    "hidden";



  document.getElementById(
    "trayTitle"
  ).innerHTML =
    TEXT.completeTrayText;



  /* 웨딩 사진 기능 표시 */

  document.getElementById(
    "photoFrame"
  ).classList.add(
    "show"
  );


  document.getElementById(
    "photoUploadBtn"
  ).classList.add(
    "show"
  );



  /* 안내 팝업 */

  setTimeout(
    () => {


      document.getElementById(
        "guide"
      ).classList.add(
        "show"
      );


    },
    350
  );

}



/* =========================================================
   꽃말 안내 확인
========================================================= */


document.getElementById(
  "guideOk"
).onclick = () => {


  document.getElementById(
    "guide"
  ).classList.remove(
    "show"
  );


  createHotspots();

};



/* =========================================================
   반짝이 꽃 위치 만들기
========================================================= */


function createHotspots() {


  const complete =
    document.getElementById(
      "completeView"
    );


  HOTSPOTS.forEach(
    h => {


      const button =
        document.createElement(
          "button"
        );


      button.className =
        "hotspot";


      button.dataset.type =
        h.type;


      button.style.left =
        h.x + "%";


      button.style.top =
        h.y + "%";


      button.style.width =
        h.size + "%";


      button.style.aspectRatio =
        "1";


      button.onclick =
        () =>
          showMeaning(
            h.type
          );


      complete.appendChild(
        button
      );

    }
  );

}



/* =========================================================
   꽃말 보여주기
========================================================= */


function showMeaning(
  type
) {


  const m =
    MEANINGS[type];



  document.getElementById(
    "mName"
  ).textContent =
    m.name;



  document.getElementById(
    "mMeaning"
  ).textContent =
    m.meaning;



  document.getElementById(
    "mMessage"
  ).textContent =
    m.message;



  /* 해당 꽃 확인 처리 */

  seen.add(
    type
  );



  document.querySelectorAll(
    `.hotspot[data-type="${type}"]`
  ).forEach(
    hotspot => {


      hotspot.classList.add(
        "seen"
      );


    }
  );



  document.getElementById(
    "meaning"
  ).classList.add(
    "show"
  );

}



/* =========================================================
   꽃말 팝업 닫기
========================================================= */


document.getElementById(
  "meaningOk"
).onclick =
  () => {


    document.getElementById(
      "meaning"
    ).classList.remove(
      "show"
    );


    /* 5종 모두 확인 */

    if (
      seen.size === 5
    ) {


      setTimeout(
        showFinal,
        300
      );

    }

  };



/* =========================================================
   마지막 결혼 축하 메시지
========================================================= */


function showFinal() {


  document.getElementById(
    "final"
  ).classList.add(
    "show"
  );



  /* 꽃잎 + 반짝이 */

  for (
    let i = 0;
    i < 24;
    i++
  ) {


    setTimeout(
      () => {


        const sparkle =
          document.createElement(
            "div"
          );


        sparkle.className =
          "spark";


        sparkle.textContent =

          [
            "🌸",
            "✨",
            "🤍",
            "🌷"
          ]
          [
            Math.floor(
              Math.random() * 4
            )
          ];



        sparkle.style.left =
          (
            Math.random()
            *
            100
          )
          +
          "vw";


        sparkle.style.animationDuration =
          (
            2.8
            +
            Math.random()
            *
            1.8
          )
          +
          "s";


        document.body.appendChild(
          sparkle
        );



        setTimeout(
          () =>
            sparkle.remove(),
          5000
        );


      },
      i * 100
    );

  }

}



/* =========================================================
   웨딩 사진 삽입
========================================================= */


const photoInput =
  document.getElementById(
    "photoInput"
  );


const photoPreview =
  document.getElementById(
    "photoPreview"
  );


const photoPlaceholder =
  document.getElementById(
    "photoPlaceholder"
  );



/* 버튼 클릭 */

document.getElementById(
  "photoUploadBtn"
).onclick =
  () => {


    photoInput.click();

  };



/* 사진 선택 */

photoInput.addEventListener(
  "change",
  event => {


    const file =
      event.target.files[0];


    if (
      !file
    ) {
      return;
    }



    const reader =
      new FileReader();



    reader.onload =
      e => {


        photoPreview.src =
          e.target.result;


        photoPreview.style.display =
          "block";


        photoPlaceholder.style.display =
          "none";

      };



    reader.readAsDataURL(
      file
    );

  }
);


</script>
